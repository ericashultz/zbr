<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCHIVED: USA Store "Under Construction" page</title>
<!--
  Archived from geocities.html when the USA Store nav/footer links were
  changed to open https://persistentvisionrecords.com/collections/zegema-beach-records
  in a new tab. This is the former #usaStoreView placeholder, kept here for
  reference only -- nothing in the live site links to it.
-->
<style>
  :root{ --white:#FFFFFF; --ink:#d9d9d9; }
  body{ margin:0; background:#000033; font-family:Arial,sans-serif; color:var(--ink); }
  /* ==== USA STORE (UNDER CONSTRUCTION) VIEW ==== */
  .construction-panel{
    max-width:640px; margin:24px auto; padding:12px;
    text-align:center;
  }
  .construction-panel .stripes{
    height:22px; margin:0 0 24px;
    background-color:#ffff00;
    background-image:repeating-linear-gradient(-45deg, #000 0 10px, #ffff00 10px 20px);
    border-top:3px solid #000; border-bottom:3px solid #000;
  }
  .construction-panel .stripes:last-child{ margin:24px 0 0; }
  .construction-panel .digger{ margin:0 0 18px; }
  .construction-panel .digger img{ width:40px; height:40px; }
  .construction-panel h2{
    font-family:"Arial Narrow",Arial,sans-serif;
    font-weight:bold; font-style:italic;
    color:var(--white); font-size:32px; margin:0 0 14px;
  }
  .construction-panel p{ font-size:15px; line-height:1.6; margin:0; color:var(--ink); }
</style>
</head>
<body>
<div class="construction-panel">
  <div class="digger" aria-hidden="true"><img src="../assets/directory_folder_options-4.png" alt=""></div>
  <h2>Under Construction</h2>
  <p>Check back soon -- in the meantime, the Canada / International store and Bandcamp are open for business!</p>
  <div class="stripes" aria-hidden="true"></div>
</div>
</body>
</html>
