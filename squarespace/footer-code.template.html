<script>
(function () {
  // Photo slideshows: switch off auto-advance (runs before the template starts the slideshows)
  [].forEach.call(document.querySelectorAll('.sqs-block-gallery[data-block-json]'), function (b) {
    var j = b.getAttribute('data-block-json');
    if (j) b.setAttribute('data-block-json', j.replace('"autoplay":true', '"autoplay":false'));
  });

  // "Search" and "View Cart" are link pages, so mark them as the current page by hand
  var path = location.pathname.replace(/\/$/, '');
  [].forEach.call(document.querySelectorAll('nav.main-nav ul li a'), function (l) {
    var h = (l.getAttribute('href') || '').replace(/\/$/, '');
    if ((path === '/search' || path === '/cart') && h === path) l.parentNode.classList.add('active-link');
  });

  // Product page: "Back to Store" link returns to the store at the same filters, page and scroll position
  var back = document.querySelector('#productNav a');
  if (back) {
    back.href = '/';
    back.innerHTML = '&laquo; Back to Store';
    back.addEventListener('click', function () {
      try { sessionStorage.setItem('zbr-store-restore', '1'); } catch (e) {}
    });
  }

  // Phone menu: remove the "Navigation" label entry
  var label = document.querySelector('nav.main-nav select option.mobile-select-label');
  if (label) label.parentNode.removeChild(label);

  // Product page: Bandcamp links in the description become players at the bottom
  var ex = document.querySelector('.product-excerpt');
  var details = document.getElementById('productDetails');
  if (ex && details) {
    [].slice.call(ex.querySelectorAll('a[href*="bandcamp.com/album/"], a[href*="bandcamp.com/track/"]')).forEach(function (a) {
      var url = a.href.split('?')[0].split('#')[0];
      var box = document.createElement('div');
      box.className = 'zbr-bcplayer';
      var f = document.createElement('iframe');
      f.src = 'https://bandcamp.com/EmbeddedPlayer/url=' + encodeURIComponent(url) + '/size=small/bgcol=000000/linkcol=c0deff/tracklist=false/transparent=true/';
      f.title = 'Bandcamp player';
      f.setAttribute('seamless', '');
      f.setAttribute('loading', 'lazy');
      box.appendChild(f);
      var p = a.closest('p');
      var rest = p ? p.textContent.replace(a.textContent, '').replace(/\s+/g, ' ').trim() : '';
      if (p && rest.length <= 20) { p.parentNode.removeChild(p); } else { a.parentNode.removeChild(a); }
      details.appendChild(box);
    });
  }

  // "View Cart" button: item count badge
  var cartLink = document.querySelector('nav.main-nav ul li a[href$="/cart"]');
  if (cartLink) {
    var badge = document.createElement('span');
    badge.className = 'zbr-cart-count';
    badge.hidden = true;
    cartLink.appendChild(badge);
    var updateCart = function () {
      fetch('/api/commerce/shopping-cart', { credentials: 'same-origin' })
        .then(function (r) { return r.json(); })
        .then(function (c) {
          var n = (c.entries || []).reduce(function (s, e) { return s + (e.quantity || 0); }, 0);
          badge.textContent = n;
          badge.hidden = !n;
        })
        .catch(function () {});
    };
    updateCart();
    document.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('.sqs-add-to-cart-button, .cart-row-remove, .cart-row-qty-dec, .cart-row-qty-inc')) setTimeout(updateCart, 1500);
    });
  }

  // Search page: placeholder text and "Start typing" hint
  var tries = 0;
  (function waitForSearch() {
    var inp = document.querySelector('.sqs-search-page-input input');
    if (!inp) { if (++tries < 40) setTimeout(waitForSearch, 150); return; }
    inp.placeholder = 'Search band names, releases, news...';
    var wrap = inp.closest('.sqs-search-page-input');
    var hint = document.createElement('p');
    hint.className = 'zbr-search-hint';
    hint.textContent = 'Start typing to search news posts and releases.';
    wrap.parentNode.insertBefore(hint, wrap.nextSibling);
    var sync = function () { hint.style.display = inp.value.trim() ? 'none' : ''; };
    inp.addEventListener('input', sync);
    sync();
    setTimeout(sync, 300);
  })();

  // News list: tidy titles, short previews with Read More, and the two-column layout with the sidebar boxes
  if (document.body.classList.contains('view-list') && document.body.classList.contains('collection-type-blog')) {
    [].forEach.call(document.querySelectorAll('article.hentry h1.entry-title a, article.hentry h2.entry-title a'), function (a) {
      a.textContent = a.textContent.replace(/^\s*\d{4}\s*-\s*\d{1,2}\s*-\s*\d{1,2}\s*\/{2,3}\s*/, '');
    });
    [].forEach.call(document.querySelectorAll('article.hentry'), function (art) {
      var body = art.querySelector('.post > .body.entry-content');
      if (!body) return;
      var long = body.textContent.replace(/\s+/g, ' ').length > 220 || body.querySelector('iframe, .sqs-block-image, .sqs-block-video, .sqs-block-embed, .sqs-block-horizontalrule');
      if (!long) return;
      art.classList.add('zbr-clamped');
      var more = document.createElement('a');
      more.className = 'zbr-readmore';
      more.href = '#';
      more.textContent = 'Read More';
      more.addEventListener('click', function (e) {
        e.preventDefault();
        var open = art.classList.toggle('zbr-clamped');
        more.textContent = open ? 'Read More' : 'Read Less';
      });
      body.parentNode.insertBefore(more, body.nextSibling);
    });

    // Numbered page buttons (1 2 3 ... 139) in place of Newer / Older.
    // The table lists every post's publish time, newest first, because Squarespace pages by "older than" times.
    (function () {
      var pager = document.querySelector('nav.page.pagination');
      if (!pager) return;
      var base = location.pathname;
      var next = pager.querySelector('li.next a');
      if (next && next.getAttribute('href').indexOf(base + '?offset=') !== 0 && next.getAttribute('href').indexOf('?offset=') !== 0) return;
      if (/\/(tag|category|author)\//.test(base)) return;
      var TS = '__NEWS_TS__'.split(',');
      var T = [], acc = 0, idxOf = {};
      TS.forEach(function (x, n) { acc = n === 0 ? parseInt(x, 36) : acc - parseInt(x, 36); T.push(acc); idxOf[acc] = n; });
      var size = 5;
      // find the newest post we have a time for (new posts since the table was built come before it)
      function locate(url, seen, tries) {
        return fetch(url, { credentials: 'same-origin' })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            var items = d.items || [], n;
            if (seen === 0 && d.pagination && d.pagination.nextPage && items.length) size = items.length;
            for (n = 0; n < items.length; n++) { if (idxOf[items[n].publishOn] !== undefined) return { i: seen + n, p: idxOf[items[n].publishOn], d: d }; }
            if (tries > 0 && d.pagination && d.pagination.nextPage) return locate(base + '?format=json&offset=' + d.pagination.nextPageOffset, seen + items.length, tries - 1);
            return null;
          });
      }
      locate(base + '?format=json', 0, 6)
        .then(function (loc) {
          if (!loc) return;
          var i = loc.i, p = loc.p;
          var total = (T.length - p) + i;
          var pages = Math.ceil(total / size);
          var q = location.search.match(/[?&]offset=(\d+)/);
          var current = 1;
          if (q) {
            var off = parseInt(q[1], 10), firstT;
            if (idxOf[off] !== undefined) firstT = idxOf[off] + 1;
            else { firstT = 0; while (firstT < T.length && T[firstT] >= off) firstT++; }
            current = Math.floor((firstT - p + i) / size) + 1;
          }
          function href(N) {
            if (N === 1) return base;
            var t = (size * (N - 1) - 1) - i + p;
            return t >= 0 && t < T.length ? base + '?offset=' + T[t] : null;
          }
          var narrow = window.matchMedia('(max-width:700px)').matches, span = narrow ? 1 : 2;
          var list = [], last = 0, N;
          for (N = 1; N <= pages; N++) {
            if (N === 1 || N === pages || (N >= current - span && N <= current + span)) {
              if (last && N - last > 1) list.push('gap');
              list.push(N); last = N;
            }
          }
          var nav = document.createElement('nav');
          nav.className = 'zbr-pagenav';
          nav.setAttribute('aria-label', 'News pages');
          var firstDate = document.querySelector('article.hentry time.published');
          var html = firstDate ? '<span class="zbr-pagenav-label">News from ' + firstDate.textContent.trim() + '</span>' : '';
          function btn(label, N, extra) {
            var h = N ? href(N) : null;
            if (!h) return '<span class="zbr-pg zbr-pg-off">' + label + '</span>';
            return '<a class="zbr-pg" href="' + h + '"' + extra + '>' + label + '</a>';
          }
          html += '<div class="zbr-pagenav-buttons">' + btn('&lsaquo;', current > 1 ? current - 1 : 0, ' aria-label="Newer"');
          list.forEach(function (x) {
            if (x === 'gap') html += '<span class="zbr-pg-gap">&hellip;</span>';
            else if (x === current) html += '<span class="zbr-pg" aria-current="true">' + x + '</span>';
            else html += btn(x, x, '');
          });
          html += btn('&rsaquo;', current < pages ? current + 1 : 0, ' aria-label="Older"') + '</div>';
          nav.innerHTML = html;
          pager.classList.add('zbr-hidden');
          pager.parentNode.insertBefore(nav, pager.nextSibling);
        })
        .catch(function () {});
    })();

    var page = document.getElementById('page');
    if (page) {
      fetch('/news-sidebar', { credentials: 'same-origin' })
        .then(function (r) { return r.ok ? r.text() : ''; })
        .then(function (html) {
          if (!html) return;
          var doc = new DOMParser().parseFromString(html, 'text/html');
          var blk = null;
          [].some.call(doc.querySelectorAll('.sqs-block-code .sqs-block-content, .sqs-block-html .sqs-block-content'), function (b) {
            if (b.querySelector('.zbr-widget')) { blk = b; return true; }
            return false;
          });
          if (!blk || document.getElementById('zbr-news-layout')) return;
          var layout = document.createElement('div');
          layout.id = 'zbr-news-layout';
          var main = document.createElement('div');
          main.id = 'zbr-news-main';
          while (page.firstChild) main.appendChild(page.firstChild);
          var side = document.createElement('aside');
          side.id = 'zbr-sidebar';
          side.innerHTML = blk.innerHTML;
          layout.appendChild(main);
          layout.appendChild(side);
          page.appendChild(layout);

          // Phones and tablets: Quick Links becomes a collapsed bar under the main menu
          var quick = side.querySelector('.zbr-w-quick .zbr-quicklinks');
          if (quick) {
            var mq = document.createElement('div');
            mq.className = 'zbr-mobile-quick';
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'zbr-mq-toggle';
            btn.setAttribute('aria-expanded', 'false');
            btn.innerHTML = 'Quick Links <span class="zbr-mq-arrow">&#9660;</span>';
            var grid = quick.cloneNode(true);
            grid.className = 'zbr-quicklinks zbr-mq-grid zbr-collapsed';
            btn.addEventListener('click', function () {
              var collapsed = grid.classList.toggle('zbr-collapsed');
              btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
            });
            mq.appendChild(btn);
            mq.appendChild(grid);
            page.insertBefore(mq, layout);
          }
        })
        .catch(function () {});
    }
  }
})();
</script>
