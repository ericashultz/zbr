<div id="zbr-store"></div>
<script>
(function () {
  'use strict';

  var BASE = 'https://zbr-rho.vercel.app';
  var SITE_MODE = true;
  try {
    var me = document.currentScript;
    if (me && me.src) BASE = new URL(me.src).origin;
    if (me && me.getAttribute('data-source') === 'site') SITE_MODE = true;
  } catch (e) { /* keep defaults */ }
  var CATALOG_URL = BASE + '/api/catalog';
  var PAGE_SIZE = 40; // products per page
  var STATE_KEY = 'zbr-store-state'; // filters, page and scroll position, saved when a product is opened
  var RESTORE_KEY = 'zbr-store-restore'; // set by the product page's "Back to Store" link
  var MOBILE_MAX = 900; // phones + tablets: stacked sidebar, collapsed filter menus (matches the nav's mobile menu)

  var VINYL = ['v12', 'v7', 'vo'];
  var MERCH = [
    { id: 'vinyl', label: 'Vinyl', sub: [
      { id: 'v12', label: '12" Records' },
      { id: 'v7', label: '7" Records' },
      { id: 'vo', label: '5"/6"/9"/10" Records' }
    ] },
    { id: 'cd', label: 'CDs' },
    { id: 'tape', label: 'Cassettes' },
    { id: 'shirt', label: 'Shirts' },
    { id: 'poster', label: 'Posters' },
    { id: 'button', label: 'Buttons' },
    { id: 'sticker', label: 'Stickers' }
  ];
  var LABELS = ['Zegema Beach Releases', 'Tomb Tree', 'Softseed Music'];

  // The Fixedsys Excelsior font is declared once, page-wide, in the site's Custom CSS (zbr-custom.css).
  var CSS = '' +
    '#zbr-store, #zbr-store *{box-sizing:border-box}' +
    '#zbr-store{padding:12px;color:#d9d9d9;font-family:Arial,sans-serif;text-align:left;line-height:1.3}' +
    '#zbr-store .zs-layout{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}' +
    '#zbr-store .zs-sidebar{flex:0 0 200px;min-width:160px;background:#000;border:3px groove #C0DEFF;padding:10px}' +
    '#zbr-store .zs-search{display:block;font:bold 12px "Fixedsys Excelsior","Courier New",monospace;color:#fff;margin:0 0 14px;text-transform:none;letter-spacing:0}' +
    '#zbr-store .zs-search input{display:block;width:100%;height:auto;margin:6px 0 0;padding:6px;font:13px "Fixedsys Excelsior","Courier New",monospace;border:2px inset #c0c0c0;border-radius:0;background:#fff;color:#000;box-shadow:none;text-transform:none;letter-spacing:0}' +
    '#zbr-store .zs-quick{display:flex;gap:8px;margin:0 0 14px}' +
    '#zbr-store button{-webkit-appearance:none;appearance:none;border-radius:0;box-shadow:none;text-transform:none;letter-spacing:0;line-height:1.3;cursor:pointer;margin:0}' +
    '#zbr-store .zs-quick button{flex:1;text-align:center;background:linear-gradient(180deg,#fff,#d4d4d4);border:2px outset #fff;color:#000332;font:bold 13px "Fixedsys Excelsior","Courier New",monospace;padding:6px 4px}' +
    '#zbr-store .zs-quick button:hover{background:#1D64A7;border-color:#1E61A8;color:#fff}' +
    '#zbr-store .zs-quick button[aria-current="true"]{border-style:inset;background:#FFEE00;color:#000}' +
    '#zbr-store .zs-section{margin:0 0 6px}' +
    '#zbr-store .zs-toggle{display:block;width:100%;text-align:left;background:#C0DEFF;color:#000;border:0;font:bold 14px "Fixedsys Excelsior","Courier New",monospace;margin:0 0 8px;padding:5px 8px}' +
    '#zbr-store .zs-toggle .zs-arrow{display:inline;float:right;transition:transform .15s ease}' +
    '#zbr-store .zs-toggle[aria-expanded="true"] .zs-arrow{transform:rotate(180deg)}' +
    '#zbr-store ul.zs-list{list-style:none;margin:0 0 10px;padding:0;max-height:420px;overflow-y:auto}' +
    '#zbr-store ul.zs-list.zs-collapsed{display:none}' +
    '#zbr-store ul.zs-list li, #zbr-store ul.zs-sublist li{list-style:none;margin:0 0 2px;padding:0;background:none}' +
    '#zbr-store ul.zs-list li::before, #zbr-store ul.zs-sublist li::before{content:none}' +
    '#zbr-store .zs-list button{display:block;width:100%;text-align:left;background:none;border:0;font:13px "Fixedsys Excelsior","Courier New",monospace;color:#C0DEFF;padding:4px 6px}' +
    '#zbr-store .zs-list button:hover, #zbr-store .zs-list button[aria-current="true"]{background:#1D64A7;color:#fff}' +
    '#zbr-store ul.zs-sublist{list-style:none;margin:2px 0 2px 14px;padding:0}' +
    '#zbr-store .zs-sublist button{display:block;width:100%;text-align:left;background:none;border:0;font:12px "Fixedsys Excelsior","Courier New",monospace;color:#d9d9d9;padding:3px 6px}' +
    '#zbr-store .zs-sublist button:hover, #zbr-store .zs-sublist button[aria-current="true"]{background:#1D64A7;color:#fff}' +
    '#zbr-store .zs-main{flex:1;min-width:260px}' +
    '#zbr-store .zs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}' +
    '#zbr-store a.zs-tile{display:block;text-align:center;text-decoration:none;background:#000;border:3px groove #C0DEFF;padding:8px;color:#fff}' +
    '#zbr-store a.zs-tile:hover{border-color:#1D64A7;background:#000}' +
    '#zbr-store .zs-imgbox{display:block;position:relative;aspect-ratio:1/1;margin:0 0 6px}' +
    '#zbr-store .zs-imgbox img{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:block;width:auto;height:auto;max-width:100%;max-height:100%;margin:0;border:2px outset #c0c0c0;background:#111}' +
    '#zbr-store .zs-band{display:block;font:bold 12px Arial,sans-serif;color:#FFEE00;text-transform:none;letter-spacing:0;overflow-wrap:anywhere;word-break:break-word}' +
    '#zbr-store .zs-band.zs-tight{font-size:10px}' +
    '#zbr-store .zs-name{display:block;font:11px Arial,sans-serif;color:#fff;margin:2px 0;text-transform:none;letter-spacing:0;overflow-wrap:anywhere;word-break:break-word}' +
    '#zbr-store .zs-price{display:block;font:bold 12px "Fixedsys Excelsior","Courier New",monospace;color:#C0DFFE;text-transform:none;letter-spacing:0}' +
    '#zbr-store .zs-price.zs-soldout{color:#ff6b6b}' +
    '#zbr-store .zs-msg{color:#d9d9d9;font-size:14px;padding:10px 2px}' +
    '#zbr-store .zs-msg a{color:#C0DEFF}' +
    '#zbr-store .zs-pagenav{text-align:center;margin:18px 0 4px;padding-top:6px}' +
    '#zbr-store .zs-pagenav-label{display:block;margin:0 0 10px;font:12px "Fixedsys Excelsior","Courier New",monospace;color:#d9d9d9;text-transform:none;letter-spacing:0}' +
    '#zbr-store .zs-pagenav-buttons{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 0}' +
    '#zbr-store .zs-pagenav button{background:linear-gradient(180deg,#e8e8e8,#a0a0a0);border:2px outset #fff;color:#000066;font:bold 13px "MS Sans Serif",Tahoma,sans-serif;width:34px;height:30px;margin:0 3px;padding:0}' +
    '#zbr-store .zs-pagenav button:hover{background:linear-gradient(180deg,#fff,#c9c9c9);color:#000}' +
    '#zbr-store .zs-pagenav button[aria-current="true"]{border-style:inset;background:linear-gradient(180deg,#a0a0a0,#e8e8e8)}' +
    '#zbr-store .zs-pagenav button[disabled]{opacity:.45;cursor:default;background:linear-gradient(180deg,#e8e8e8,#a0a0a0);color:#000066}' +
    '#zbr-store .zs-pagenav .zs-gap{display:inline-block;width:20px;text-align:center;color:#d9d9d9;font:bold 13px "Fixedsys Excelsior","Courier New",monospace}' +
    // Squarespace caps normal pages at 710px; let the store page use the full frame like the redesign (4 columns)
    'body.zbr-store-page #page{max-width:none!important;margin-left:0!important;margin-right:0!important;padding-bottom:24px!important}' +
    '@media (max-width:' + MOBILE_MAX + 'px){#zbr-store{padding:4px 12px 12px}#zbr-store .zs-sidebar{flex:1 1 100%;width:100%}#zbr-store .zs-pagenav button{width:32px;margin:0 2px}#zbr-store .zs-pagenav .zs-gap{width:16px}}';

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function norm(s) { return String(s || '').trim().toLowerCase(); }

  // Band names are stored in ALL CAPS; show them in normal capitalization like the redesign.
  // Only fully-capitalized words are changed, so "BARONESS x UNPERSONS" -> "Baroness x Unpersons".
  var KEEP_AS_IS = { 'SNAG': 'SNAG', 'NOFX': 'NOFX' }; // stylized names that stay all caps (add more here)
  function caseWord(w) {
    if (/[a-z]/.test(w)) return w;                                   // already mixed/lower case
    if (KEEP_AS_IS[w]) return KEEP_AS_IS[w];
    if (/(?:[A-Z]\.){2,}/.test(w)) return w;                          // initialisms: A.C., I.O.
    if (/[A-Za-z]\d|\d[A-Za-z]/.test(w)) return w;                   // digits glued to letters: 124C41+, .22LR, 3RD
    var letters = w.replace(/[^A-Za-zÀ-ÿ]/g, '');
    if (letters.length > 1 && letters.length <= 5 && !/[AEIOUYÀ-ÿ]/.test(letters)) return w; // DSGNS, TNG, ZBR
    return w.toLowerCase().replace(/(^|[-\/(\[+&"“])([a-zà-ÿ])/g, function (m, a, c) { return a + c.toUpperCase(); });
  }
  function prettyBand(b) {
    return String(b || '').split(/(\s+)/).map(function (t) { return /^\s+$/.test(t) ? t : caseWord(t); }).join('');
  }
  function longestWord(s) {
    return String(s).split(/[\s\/&+-]+/).reduce(function (m, w) { return Math.max(m, w.length); }, 0);
  }

  // ---- Site mode: build the slim catalog in the browser from this site's own collections ----
  // Mirrors api/catalog.js (keep the two in sync).
  var SITE_COLLECTIONS = [
    { slug: 'zegema-beach-releases', label: 'Zegema Beach Releases' },
    { slug: 'tomb-tree-tapes', label: 'Tomb Tree' },
    { slug: 'softseed', label: 'Softseed Music' },
    { slug: 'specials', special: 'new' },
    { slug: 'steals', special: 'steals' },
    { slug: '12inches', fmt: ['v12'] },
    { slug: '12distro2', fmt: ['v12'] },
    { slug: 'distro-7inch', fmt: ['v7'] },
    { slug: 'oddvinyl', fmt: ['vo'] },
    { slug: 'cassettes', fmt: ['tape'] },
    { slug: 'cds', fmt: ['cd'] },
    { slug: 'shirts', fmt: ['shirt'] },
    { slug: 'posters1', fmt: ['poster'] },
    { slug: 'posters2', fmt: ['poster'] },
    { slug: 'buttons', fmt: ['button'] },
    { slug: 'stickers', fmt: ['sticker'] }
  ];
  var CATEGORY_FORMATS = {
    '12"': ['v12'], '2x12"': ['v12'], 'cd/12"': ['v12', 'cd'],
    '7"': ['v7'],
    '10"': ['vo'], '5"': ['vo'], '6"': ['vo'], '8"': ['vo'], '9"': ['vo'],
    'cassette': ['tape'],
    'cd': ['cd'], 'cds': ['cd'], '3"cd': ['cd'],
    't-shirt': ['shirt'], 'shirts': ['shirt'], 'crewneck': ['shirt'], 'hooded sweatshirt': ['shirt'], 'hoodie': ['shirt'],
    'poster': ['poster'],
    'button': ['button'], 'pin': ['button'],
    'sticker': ['sticker'], 'patch/sticker': ['sticker'], 'patch': ['sticker']
  };
  var CACHE_KEY = 'zbr-store-catalog-v1';
  var CACHE_MS = 60 * 60 * 1000;

  function decodeEntities(str) {
    return str.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
      .replace(/&quot;/g, '"').replace(/&#39;|&#x27;/g, "'");
  }
  function siteImage(item) {
    var own = item.assetUrl || '';
    var isFolder = own.slice(-1) === '/' || /^\d+$/.test(own.split('/').pop());
    if (own && !isFolder) return own;
    var kids = item.items || [];
    for (var k = 0; k < kids.length; k++) if (kids[k] && kids[k].assetUrl) return kids[k].assetUrl;
    return own;
  }
  function slimItem(item, col) {
    var sc = item.structuredContent || {};
    var variants = sc.variants || [];
    var cents = variants.map(function (v) { return v.onSale && v.salePrice > 0 ? v.salePrice : v.price; })
      .filter(function (n) { return typeof n === 'number'; });
    if (!cents.length && typeof sc.priceCents === 'number') cents.push(sc.priceCents);
    var min = cents.length ? Math.min.apply(null, cents) : 0;
    var max = cents.length ? Math.max.apply(null, cents) : 0;
    var soldOut = variants.length > 0 && variants.every(function (v) { return !v.unlimited && v.qtyInStock === 0; });

    var fmts = {};
    (col.fmt || []).forEach(function (f) { fmts[f] = 1; });
    (item.categories || []).forEach(function (c) {
      (CATEGORY_FORMATS[String(c).toLowerCase()] || []).forEach(function (f) { fmts[f] = 1; });
    });

    var title = decodeEntities(String(item.title || '')).trim();
    var dash = title.indexOf(' - ');
    var img = siteImage(item);
    var out = {
      b: dash > 0 ? title.slice(0, dash).trim() : '',
      n: dash > 0 ? title.slice(dash + 3).trim() : title,
      u: item.fullUrl,
      i: img ? img + '?format=500w' : '',
      p: min / 100
    };
    if (max !== min) out.r = 1;
    if (soldOut) out.s = 1;
    if (Object.keys(fmts).length) out.f = Object.keys(fmts);
    if (col.label) out.l = col.label;
    if (col.special) out.sp = col.special;
    return out;
  }
  function loadFromSite(root) {
    try {
      var cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (cached && cached.items && cached.items.length && Date.now() - cached.t < CACHE_MS) {
        return Promise.resolve({ items: cached.items });
      }
    } catch (e) { /* no storage: fetch fresh */ }

    var done = 0, failed = 0, failures = [];
    var msg = root.querySelector('.zs-msg');
    return Promise.all(SITE_COLLECTIONS.map(function (col) {
      return fetch('/' + col.slug + '?format=json', { credentials: 'same-origin' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (data) {
          return (data.items || []).filter(function (i) { return i.fullUrl; }).map(function (i) { return slimItem(i, col); });
        })
        .catch(function (e) { failed++; failures.push('/' + col.slug + ' (' + (e && e.message || 'error') + ')'); return []; }) // a missing page just leaves its products out
        .then(function (list) {
          done++;
          if (msg) msg.innerHTML = 'Loading the store&hellip; ' + done + ' of ' + SITE_COLLECTIONS.length;
          return list;
        });
    })).then(function (lists) {
      var items = [].concat.apply([], lists);
      if (!items.length) { var err = new Error('empty'); err.detail = failures.slice(0, 4).join(', '); throw err; }
      if (!failed) {
        try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), items: items })); } catch (e) { /* ignore */ }
      }
      return { items: items };
    });
  }

  function init() {
    var root = document.getElementById('zbr-store');
    if (!root || root.getAttribute('data-zs-ready')) return;
    root.setAttribute('data-zs-ready', '1');
    document.body.classList.add('zbr-store-page');

    if (!document.getElementById('zbr-store-css')) {
      var style = document.createElement('style');
      style.id = 'zbr-store-css';
      style.textContent = CSS;
      document.head.appendChild(style);
    }

    root.innerHTML = '<p class="zs-msg">Loading the store&hellip;</p>';

    var loading = SITE_MODE
      ? loadFromSite(root)
      : fetch(CATALOG_URL).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
    loading
      .then(function (catalog) { build(root, catalog.items || []); })
      .catch(function (err) {
        root.innerHTML = '<p class="zs-msg">The store grid couldn\'t load right now. You can still browse: ' +
          '<a href="/zegema-beach-releases">Zegema Beach Releases</a> &middot; ' +
          '<a href="/tomb-tree-tapes">Tomb Tree</a> &middot; ' +
          '<a href="/softseed">Softseed Music</a> &middot; ' +
          '<a href="/specials">New Items / Specials</a></p>' +
          (SITE_MODE ? '<p class="zs-msg" style="font-size:11px;opacity:.7">Details: ' + esc((err && err.detail) || (err && err.message) || 'unknown') + ' &mdash; page ' + esc(location.pathname) + '</p>' : '');
      });
  }

  function build(root, items) {
    var mq = window.matchMedia('(max-width:' + MOBILE_MAX + 'px)');
    var collapsedByDefault = mq.matches;
    var st = { band: '', cat: '', size: '', label: '', special: '', query: '', page: 1 };

    items.forEach(function (p) { p.b = prettyBand(p.b); });

    // Bands A-Z: unique (case-insensitive), skipping the label's own name
    var seen = {}, bands = [];
    items.forEach(function (p) {
      var k = norm(p.b);
      if (!k || k === 'zegema beach records' || seen[k]) return;
      seen[k] = 1;
      bands.push(p.b);
    });
    function sortKey(b) { return b.replace(/^[^A-Za-z0-9\u00C0-\uFFFF]+/, '') || b; } // ignore leading punctuation like "..." or "["
    bands.sort(function (a, b) { return sortKey(a).localeCompare(sortKey(b), undefined, { sensitivity: 'base', numeric: true }); });

    function section(title, listHtml) {
      return '<div class="zs-section">' +
        '<button type="button" class="zs-toggle" data-zs-toggle aria-expanded="' + (collapsedByDefault ? 'false' : 'true') + '">' + esc(title) + ' <span class="zs-arrow">&#9660;</span></button>' +
        '<ul class="zs-list' + (collapsedByDefault ? ' zs-collapsed' : '') + '">' + listHtml + '</ul></div>';
    }

    var bandsHtml = '<li><button type="button" data-zs-viewall>View All</button></li>' + bands.map(function (b) {
      return '<li><button type="button" data-zs-band="' + esc(b) + '">' + esc(b) + '</button></li>';
    }).join('');

    var merchHtml = '<li><button type="button" data-zs-viewall>View All</button></li>' + MERCH.map(function (m) {
      var sub = m.sub ? '<ul class="zs-sublist">' + m.sub.map(function (s) {
        return '<li><button type="button" data-zs-cat="vinyl" data-zs-size="' + s.id + '">' + esc(s.label) + '</button></li>';
      }).join('') + '</ul>' : '';
      return '<li><button type="button" data-zs-cat="' + m.id + '">' + esc(m.label) + '</button>' + sub + '</li>';
    }).join('');

    var labelsHtml = '<li><button type="button" data-zs-viewall>View All</button></li>' + LABELS.map(function (l) {
      return '<li><button type="button" data-zs-label="' + esc(l) + '">' + esc(l) + '</button></li>';
    }).join('');

    root.innerHTML =
      '<div class="zs-layout">' +
        '<aside class="zs-sidebar">' +
          '<label class="zs-search">Search<input type="text" placeholder="Band or release..." autocomplete="off"></label>' +
          '<div class="zs-quick">' +
            '<button type="button" data-zs-special="new">New Items</button>' +
            '<button type="button" data-zs-special="steals">Steals</button>' +
          '</div>' +
          section('Bands A-Z', bandsHtml) +
          section('Merch', merchHtml) +
          section('Labels', labelsHtml) +
        '</aside>' +
        '<div class="zs-main"><div class="zs-grid"></div><nav class="zs-pagenav" aria-label="Store pages"></nav></div>' +
      '</div>';

    var grid = root.querySelector('.zs-grid');
    var pager = root.querySelector('.zs-pagenav');
    var search = root.querySelector('.zs-search input');

    function hasFmt(p, code) { return !!p.f && p.f.indexOf(code) !== -1; }

    function matches(p, q) {
      if (st.band && norm(p.b) !== norm(st.band)) return false;
      if (st.cat === 'vinyl') { if (!VINYL.some(function (c) { return hasFmt(p, c); })) return false; }
      else if (st.cat && !hasFmt(p, st.cat)) return false;
      if (st.size && !hasFmt(p, st.size)) return false;
      if (st.label && p.l !== st.label) return false;
      if (st.special && p.sp !== st.special) return false;
      if (q && ((p.b || '') + ' ' + p.n).toLowerCase().indexOf(q) === -1) return false;
      return true;
    }

    function priceLabel(p) {
      if (p.s) return 'SOLD OUT';
      return (p.r ? 'from ' : '') + 'CA$' + p.p.toFixed(2);
    }

    // Page numbers to show: first, last, and the pages around the current one, with "..." gaps.
    function pageList(cur, n, around) {
      var keep = {};
      keep[1] = 1; keep[n] = 1;
      for (var i = cur - around; i <= cur + around; i++) if (i >= 1 && i <= n) keep[i] = 1;
      var nums = Object.keys(keep).map(Number).sort(function (a, b) { return a - b; });
      var out = [], prev = 0;
      nums.forEach(function (x) {
        if (prev && x - prev === 2) out.push(prev + 1);
        else if (prev && x - prev > 2) out.push('gap');
        out.push(x);
        prev = x;
      });
      return out;
    }

    function renderPager(total, pages) {
      if (pages <= 1) { pager.innerHTML = ''; return; }
      var from = (st.page - 1) * PAGE_SIZE + 1, to = Math.min(total, st.page * PAGE_SIZE);
      var around = mq.matches ? 1 : 2;
      var btns = '<button type="button" data-zs-page="prev" aria-label="Previous page"' + (st.page === 1 ? ' disabled' : '') + '>&lsaquo;</button>' +
        pageList(st.page, pages, around).map(function (x) {
          return x === 'gap'
            ? '<span class="zs-gap" aria-hidden="true">&hellip;</span>'
            : '<button type="button" data-zs-page="' + x + '" aria-label="Page ' + x + '" aria-current="' + (x === st.page ? 'true' : 'false') + '">' + x + '</button>';
        }).join('') +
        '<button type="button" data-zs-page="next" aria-label="Next page"' + (st.page === pages ? ' disabled' : '') + '>&rsaquo;</button>';
      pager.innerHTML = '<span class="zs-pagenav-label">Showing ' + from.toLocaleString('en-US') + '-' + to.toLocaleString('en-US') + ' of ' + total.toLocaleString('en-US') + '</span>' +
        '<div class="zs-pagenav-buttons">' + btns + '</div>';
    }

    function render() {
      var q = norm(st.query);
      var filtered = items.filter(function (p) { return matches(p, q); });
      var pages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      if (st.page > pages) st.page = pages;

      if (!filtered.length) {
        grid.innerHTML = '<p class="zs-msg">No releases match that search.</p>';
        pager.innerHTML = '';
      } else {
        grid.innerHTML = filtered.slice((st.page - 1) * PAGE_SIZE, st.page * PAGE_SIZE).map(function (p) {
          return '<a class="zs-tile" href="' + esc(p.u) + '">' +
            '<span class="zs-imgbox">' + (p.i ? '<img src="' + esc(p.i) + '" alt="' + esc((p.b ? p.b + ' - ' : '') + p.n) + '" loading="lazy">' : '') + '</span>' +
            (p.b ? '<span class="zs-band' + (longestWord(p.b) >= 15 ? ' zs-tight' : '') + '">' + esc(p.b) + '</span>' : '') +
            '<span class="zs-name">' + esc(p.n) + '</span>' +
            '<span class="zs-price' + (p.s ? ' zs-soldout' : '') + '">' + esc(priceLabel(p)) + '</span>' +
            '</a>';
        }).join('');
        renderPager(filtered.length, pages);
      }

      // aria-current state, same rules as the redesign
      root.querySelectorAll('[data-zs-band]').forEach(function (b) { b.setAttribute('aria-current', st.band && b.getAttribute('data-zs-band') === st.band ? 'true' : 'false'); });
      root.querySelectorAll('[data-zs-cat]').forEach(function (b) {
        var size = b.getAttribute('data-zs-size');
        var on = size ? size === st.size : (b.getAttribute('data-zs-cat') === st.cat && !st.size);
        b.setAttribute('aria-current', on ? 'true' : 'false');
      });
      root.querySelectorAll('[data-zs-label]').forEach(function (b) { b.setAttribute('aria-current', st.label && b.getAttribute('data-zs-label') === st.label ? 'true' : 'false'); });
      root.querySelectorAll('[data-zs-special]').forEach(function (b) { b.setAttribute('aria-current', b.getAttribute('data-zs-special') === st.special ? 'true' : 'false'); });
      root.querySelectorAll('.zs-list').forEach(function (list) {
        var all = list.querySelector('[data-zs-viewall]');
        if (!all) return;
        var active = list.querySelector('[aria-current="true"]:not([data-zs-viewall])');
        all.setAttribute('aria-current', active ? 'false' : 'true');
      });
    }

    function setFilter(next) {
      // One filter group at a time, like the redesign; search stays on top of it.
      st.band = next.band || ''; st.cat = next.cat || ''; st.size = next.size || '';
      st.label = next.label || ''; st.special = next.special || '';
      st.page = 1;
      render();
    }

    search.addEventListener('input', function () { st.query = search.value; st.page = 1; render(); });

    root.addEventListener('click', function (e) {
      var t = e.target.closest('button');
      if (!t || !root.contains(t)) return;

      if (t.hasAttribute('data-zs-toggle')) {
        var list = t.nextElementSibling;
        var collapsed = list.classList.toggle('zs-collapsed');
        t.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      } else if (t.hasAttribute('data-zs-viewall')) {
        setFilter({});
      } else if (t.hasAttribute('data-zs-band')) {
        var b = t.getAttribute('data-zs-band');
        setFilter({ band: st.band === b ? '' : b });
      } else if (t.hasAttribute('data-zs-cat')) {
        if (t.hasAttribute('data-zs-size')) {
          var sz = t.getAttribute('data-zs-size');
          setFilter(st.size === sz ? {} : { cat: 'vinyl', size: sz });
        } else {
          var c = t.getAttribute('data-zs-cat');
          setFilter(st.cat === c && !st.size ? {} : { cat: c });
        }
      } else if (t.hasAttribute('data-zs-label')) {
        var l = t.getAttribute('data-zs-label');
        setFilter({ label: st.label === l ? '' : l });
      } else if (t.hasAttribute('data-zs-special')) {
        var s = t.getAttribute('data-zs-special');
        setFilter({ special: st.special === s ? '' : s });
      } else if (t.hasAttribute('data-zs-page')) {
        var target = t.getAttribute('data-zs-page');
        var cur = st.page;
        st.page = target === 'prev' ? cur - 1 : target === 'next' ? cur + 1 : parseInt(target, 10);
        if (st.page !== cur) {
          render();
          var top = root.querySelector('.zs-main').getBoundingClientRect().top + window.pageYOffset - 12;
          window.scrollTo(0, Math.max(0, top)); // back to the top of the grid, like the news pagination
        }
      }
    });

    function applyMenuDefaults() {
      root.querySelectorAll('[data-zs-toggle]').forEach(function (btn) {
        btn.nextElementSibling.classList.toggle('zs-collapsed', mq.matches);
        btn.setAttribute('aria-expanded', mq.matches ? 'false' : 'true');
      });
    }
    if (mq.addEventListener) mq.addEventListener('change', applyMenuDefaults);
    else if (mq.addListener) mq.addListener(applyMenuDefaults);

    // Remember where the visitor was when they open a product, so "Back to Store" can return there.
    root.addEventListener('click', function (e) {
      var tile = e.target.closest && e.target.closest('a.zs-tile');
      if (!tile) return;
      try {
        sessionStorage.setItem(STATE_KEY, JSON.stringify({
          t: Date.now(), y: window.pageYOffset,
          band: st.band, cat: st.cat, size: st.size, label: st.label, special: st.special, query: st.query, page: st.page
        }));
      } catch (err) { /* no storage: back link just lands on the first page */ }
    });

    var saved = null, flag = '', navType = '';
    try { saved = JSON.parse(sessionStorage.getItem(STATE_KEY) || 'null'); } catch (err) { /* ignore */ }
    try { flag = sessionStorage.getItem(RESTORE_KEY) || ''; sessionStorage.removeItem(RESTORE_KEY); } catch (err) { /* ignore */ }
    try { navType = performance.getEntriesByType('navigation')[0].type; } catch (err) { /* ignore */ }

    if (saved && saved.t && Date.now() - saved.t < 60 * 60 * 1000 && (flag === '1' || navType === 'back_forward')) {
      ['band', 'cat', 'size', 'label', 'special', 'query'].forEach(function (k) { st[k] = saved[k] || ''; });
      st.page = saved.page || 1;
      search.value = st.query;
      render();
      var y = saved.y || 0;
      setTimeout(function () { window.scrollTo(0, y); }, 0);
      setTimeout(function () { window.scrollTo(0, y); }, 400); // again once fonts and images settle
    } else {
      render();
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
