<script>
// The Persistent Vision Records page (/pvc) is the store with that label picked, not Squarespace's own plain product list: go straight there
// (replace, so the Back button does not bounce back here). The products' own pages (/pvc/...) are left alone.
if (/^\/pvc\/?$/i.test(location.pathname)) location.replace('/?label=Persistent+Vision+Records');
</script>
<script>
// Remembers the cart count from the last page and marks the page right away (before anything is drawn), so the "View Cart" button has room
// for the count circle from the first frame and the menu does not shift when the footer code adds the real circle.
try {
  var zbrN = parseInt(localStorage.getItem('zbr-cart-n'), 10);
  if (zbrN > 0) {
    document.documentElement.classList.add('zbr-cart-has');
    document.documentElement.style.setProperty('--zbr-cart-n', '"' + zbrN + '"');
    // the cart page's height from the last visit (same screen size): the cart keeps that much room until its items have drawn
    try {
      var zbrH = (localStorage.getItem('zbr-cart-h') || '').split(':');
      if (zbrH[0] === (window.innerWidth <= 700 ? 's' : 'l') && parseInt(zbrH[1], 10) > 0) document.documentElement.style.setProperty('--zbr-cart-h', parseInt(zbrH[1], 10) + 'px');
    } catch (e) {}
    document.documentElement.style.setProperty('--zbr-cart-w', (zbrN < 10 ? 16 : zbrN < 100 ? 22 : 28) + 'px');   // the circle has a fixed width, so it never changes size when the pixel font finishes loading
  }
} catch (e) {}
</script>
<link rel="preload" as="font" type="font/woff2" href="https://static1.squarespace.com/static/51f9e29ee4b0d46ee28f3709/t/6ad76ac8d822c91627893930/1792502473012/FixedsysExcelsior.woff2" crossorigin>
<script>
// the footer code marks the page ready when it has set it up; this does it after 1.2 seconds even if that never happens
setTimeout(function () { document.documentElement.classList.add('zbr-ready'); }, 1200);
</script>
