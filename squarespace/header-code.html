<script>
// Remembers the cart count from the last page and marks the page right away (before anything is drawn), so the "View Cart" button has room
// for the count circle from the first frame and the menu does not shift when the footer code adds the real circle.
try {
  var zbrN = parseInt(localStorage.getItem('zbr-cart-n'), 10);
  if (zbrN > 0) {
    document.documentElement.classList.add('zbr-cart-has');
    document.documentElement.style.setProperty('--zbr-cart-n', '"' + zbrN + '"');
    // the cart page's height from the last visit (same screen size): the cart keeps that much room until its items have drawn
    try {
      var zbrH = (localStorage.getItem('zbr-cart-h') || '').split(':');
      if (zbrH[0] === (window.innerWidth <= 700 ? 's' : 'l') && parseInt(zbrH[1], 10) > 0) document.documentElement.style.setProperty('--zbr-cart-h', parseInt(zbrH[1], 10) + 'px');
    } catch (e) {}
    document.documentElement.style.setProperty('--zbr-cart-w', (zbrN < 10 ? 16 : zbrN < 100 ? 22 : 28) + 'px');   // the circle has a fixed width, so it never changes size when the pixel font finishes loading
  }
} catch (e) {}
</script>

<script>
// the footer code marks the page ready when it has set it up (the CSS shows the page's content then); this timer does it after 1.2 seconds
// even if that never happens
setTimeout(function () {
  document.documentElement.classList.add('zbr-ready');
  if (document.getElementById('zbr-ready')) return;
  var s = document.createElement('span'); s.id = 'zbr-ready'; s.hidden = true;
  (document.body || document.documentElement).appendChild(s);
}, 1200);
</script>
<script>
// TEMPORARY flight recorder (to find the page-to-page blink): for the first 2.5 s of every page load it notes, on every frame the browser draws,
// what the page looks like at that moment. The last 12 loads are kept in this browser (localStorage "zbr-diag"); nothing is sent anywhere.
(function () {
  try {
    var rec = { u: location.pathname + location.search, v: document.visibilityState, f: [] }, last = '';
    var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    if (nav) rec.nav = { type: nav.type, act: Math.round(nav.activationStart || 0), resp: Math.round(nav.responseEnd) };
    var saved = false;
    var save = function () {
      if (saved) return;
      saved = true;
      try {
        var all = JSON.parse(localStorage.getItem('zbr-diag') || '[]');
        all.push(rec);
        localStorage.setItem('zbr-diag', JSON.stringify(all.slice(-12)));
      } catch (e) {}
    };
    try {
      new PerformanceObserver(function (l) { l.getEntries().forEach(function (e) { rec.f.push([Math.round(e.startTime), 'PAINT ' + e.name]); }); }).observe({ type: 'paint', buffered: true });
      new PerformanceObserver(function (l) { l.getEntries().forEach(function (e) { rec.f.push([Math.round(e.startTime), 'SHIFT ' + e.value.toFixed(3)]); }); }).observe({ type: 'layout-shift', buffered: true });
    } catch (e) {}
    var tick = function (ts) {
      var d = document, t = Math.round(ts), hw = d.getElementById('headerWrapper'), pg = d.getElementById('page'), cv = d.getElementById('canvas'), ft = d.getElementById('footerWrapper');
      var sig = [hw ? Math.round(hw.getBoundingClientRect().height) : '-', cv ? Math.round(cv.getBoundingClientRect().height) : '-', pg ? getComputedStyle(pg).visibility.charAt(0) + Math.round(pg.getBoundingClientRect().height) : '-',
                 ft ? Math.round(ft.getBoundingClientRect().top) : '-', d.documentElement.classList.contains('zbr-ready') ? 'R' : '-', d.documentElement.classList.contains('zbr-cart-has') ? 'C' : '-', d.readyState.charAt(0), d.body ? d.body.children.length : 0, d.documentElement.scrollHeight].join(' ');
      if (sig !== last) { rec.f.push([t, sig]); last = sig; }
      if (t < 2500) requestAnimationFrame(tick); else save();
    };
    requestAnimationFrame(tick);
    window.addEventListener('pagehide', save);
  } catch (e) {}
})();
</script>
