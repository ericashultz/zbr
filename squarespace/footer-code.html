<script>
(function () {
  // Photo slideshows: switch off auto-advance (runs before the template starts the slideshows)
  [].forEach.call(document.querySelectorAll('.sqs-block-gallery[data-block-json]'), function (b) {
    var j = b.getAttribute('data-block-json');
    if (j) b.setAttribute('data-block-json', j.replace('"autoplay":true', '"autoplay":false'));
  });

  // "Search" and "View Cart" are link pages, so mark them as the current page by hand
  var path = location.pathname.replace(/\/$/, '');
  [].forEach.call(document.querySelectorAll('nav.main-nav ul li a'), function (l) {
    var h = (l.getAttribute('href') || '').replace(/\/$/, '');
    if ((path === '/search' || path === '/cart') && h === path) l.parentNode.classList.add('active-link');
  });

  // Text blocks: hide empty (non-breaking-space) paragraphs at the end of a block, which only add stray gaps
  [].forEach.call(document.querySelectorAll('.sqs-block-html .sqs-html-content'), function (box) {
    var last = box.lastElementChild;
    while (last && last.tagName === 'P' && !last.textContent.replace(/\u00a0/g, '').trim() && !last.querySelector('img, iframe')) {
      last.classList.add('zbr-empty');
      last = last.previousElementSibling;
    }
    if (last && last.tagName === 'P') last.classList.add('zbr-last');
  });

  // CTA button blocks: hide empty blocks above them, then measure and set the gap to the text above
  // (the gap below a CTA, to the player, is fixed by the CSS at 18px; a little less above matches it by eye)
  [].forEach.call(document.querySelectorAll('article.hentry .sqs-block-button'), function (btn) {
    var prev = btn.previousElementSibling;
    while (prev && (prev.classList.contains('sqs-block-spacer') ||
      (prev.classList.contains('sqs-block-html') && !prev.textContent.replace(/ /g, '').trim() && !prev.querySelector('img, iframe')))) {
      prev.classList.add('zbr-empty');
      prev = prev.previousElementSibling;
    }
    if (prev && !prev.classList.contains('sqs-block-button')) { prev.classList.add('zbr-before-cta'); btn.classList.add('zbr-cta-gap'); }
  });
  var evenCtaSpacing = function () {
    [].forEach.call(document.querySelectorAll('article.hentry .sqs-block-button'), function (btn) {
      var link = btn.querySelector('a');
      var card = btn.closest('article.hentry');
      if (!link || !card) return;
      var blocks = [].slice.call(card.querySelectorAll('.sqs-block, .zbr-bcplayer'));
      var i = blocks.indexOf(btn), prev = null, k;
      for (k = i - 1; k >= 0; k--) { if (blocks[k].getBoundingClientRect().height > 0) { prev = blocks[k]; break; } }
      if (!prev || prev.classList.contains('sqs-block-button')) return;   // stacked CTAs keep their small gap
      var bottom = 0;
      [].forEach.call(prev.querySelectorAll('p, li, h1, h2, h3, h4, iframe, img'), function (el) {
        var r = el.getBoundingClientRect();
        if (r.height > 0) bottom = Math.max(bottom, r.bottom);
      });
      if (!bottom) bottom = prev.getBoundingClientRect().bottom;
      var gap = link.getBoundingClientRect().top - bottom;
      var cur = parseFloat(getComputedStyle(btn).marginTop) || 0;
      btn.style.setProperty('margin-top', Math.max(-160, cur + (14 - gap)) + 'px', 'important'); // can be negative when the space above comes from the block before it
    });
  };
  if (document.readyState === 'complete') evenCtaSpacing();
  else window.addEventListener('load', function () { evenCtaSpacing(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { setTimeout(evenCtaSpacing, 300); });

  // Product page: "Back to Store" link returns to the store at the same filters, page and scroll position
  var back = document.querySelector('#productNav a');
  if (back) {
    back.href = '/';
    back.innerHTML = '&laquo; Back to Store';
    back.addEventListener('click', function () {
      try { sessionStorage.setItem('zbr-store-restore', '1'); } catch (e) {}
    });
  }

  // Phone menu: remove the "Navigation" label entry
  var label = document.querySelector('nav.main-nav select option.mobile-select-label');
  if (label) label.parentNode.removeChild(label);

  // Product page and product blocks: hide the catalog-number line that starts many descriptions
  // (e.g. NHOMME ‘…’ tape (ZBR314)): a short first paragraph that ends with a code in brackets, or is centred
  [].forEach.call(document.querySelectorAll('.product-excerpt'), function (ex) {
    var p = ex.querySelector('p');
    if (!p || p !== ex.firstElementChild) return;
    var t = p.textContent.replace(/\s+/g, ' ').trim();
    var centred = /text-align:\s*center/i.test(p.getAttribute('style') || '');
    if ((centred || /\([A-Z]{1,4}\d+(?:-\d+)?\)$/.test(t)) && t.length < 160) p.classList.add('zbr-catline');
  });

  // Product page and product blocks inside posts: Bandcamp links in the description become players at the bottom
  [].forEach.call(document.querySelectorAll('.product-excerpt'), function (ex) {
    var details = ex.closest('#productDetails, .productDetails');
    if (!details) return;
    [].slice.call(ex.querySelectorAll('a[href*="bandcamp.com/album/"], a[href*="bandcamp.com/track/"]')).forEach(function (a) {
      var url = a.href.split('?')[0].split('#')[0];
      var box = document.createElement('div');
      box.className = 'zbr-bcplayer';
      var f = document.createElement('iframe');
      f.src = 'https://bandcamp.com/EmbeddedPlayer/url=' + encodeURIComponent(url) + '/size=small/bgcol=000000/linkcol=c0deff/tracklist=false/transparent=true/';
      f.title = 'Bandcamp player';
      f.setAttribute('seamless', '');
      f.setAttribute('loading', 'lazy');
      box.appendChild(f);
      var p = a.closest('p');
      var rest = p ? p.textContent.replace(a.textContent, '').replace(/\s+/g, ' ').trim() : '';
      if (p && rest.length <= 20) { p.parentNode.removeChild(p); } else { a.parentNode.removeChild(a); }
      details.appendChild(box);
    });
  });

  // "View Cart" button: item count badge
  var cartLink = document.querySelector('nav.main-nav ul li a[href$="/cart"]');
  if (cartLink) {
    var badge = document.createElement('span');
    badge.className = 'zbr-cart-count';
    badge.hidden = true;
    cartLink.appendChild(badge);
    var updateCart = function () {
      fetch('/api/commerce/shopping-cart', { credentials: 'same-origin' })
        .then(function (r) { return r.json(); })
        .then(function (c) {
          var n = (c.entries || []).reduce(function (s, e) { return s + (e.quantity || 0); }, 0);
          badge.textContent = n;
          badge.hidden = !n;
        })
        .catch(function () {});
    };
    updateCart();
    document.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('.sqs-add-to-cart-button, .cart-row-remove, .cart-row-qty-dec, .cart-row-qty-inc')) setTimeout(updateCart, 1500);
    });
  }

  // Search page: placeholder text and "Start typing" hint
  var tries = 0;
  (function waitForSearch() {
    var inp = document.querySelector('.sqs-search-page-input input');
    if (!inp) { if (++tries < 40) setTimeout(waitForSearch, 150); return; }
    inp.placeholder = 'Search band names, releases, news...';
    var wrap = inp.closest('.sqs-search-page-input');
    var hint = document.createElement('p');
    hint.className = 'zbr-search-hint';
    hint.textContent = 'Start typing to search news posts and releases.';
    wrap.parentNode.insertBefore(hint, wrap.nextSibling);
    var sync = function () { hint.style.display = inp.value.trim() ? 'none' : ''; };
    inp.addEventListener('input', sync);
    sync();
    setTimeout(sync, 300);
  })();

  // News list: split each news post into cards, tidy titles, short previews with Read More, and the two-column layout
  if (document.body.classList.contains('view-list') && document.body.classList.contains('collection-type-blog')) {
    var isRule = function (el) { return el.classList.contains('sqs-block-horizontalrule'); };
    var fixLabel = function (t) { t = t.trim(); return /^premiers$/i.test(t) ? 'Premieres' : t; };   // corrects the common spelling slip
    // Bandcamp embeds (tall "large" players) become the slim player used everywhere else on the site
    var bcFrom = function (fr, big) {
      var mm = decodeURIComponent((fr && fr.src) || '').match(/EmbeddedPlayer\/(?:v=\d+\/)?(album|track)=(\d+)/);
      if (!mm) return null;
      var pl = document.createElement('div');
      pl.className = 'zbr-bcplayer' + (big ? ' zbr-bc-large' : '');
      var opts = big ? 'size=large/bgcol=000000/linkcol=c0deff/tracklist=false/artwork=small/transparent=true/'
                     : 'size=small/bgcol=000000/linkcol=c0deff/tracklist=false/transparent=true/';
      pl.innerHTML = '<iframe src="https://bandcamp.com/EmbeddedPlayer/' + mm[1] + '=' + mm[2] + '/' + opts + '" seamless title="Bandcamp player"></iframe>';
      return pl;
    };
    var textOf = function (blocks) {
      return blocks.filter(function (b) { return b.classList.contains('sqs-block-html'); })
        .map(function (b) { return b.textContent; }).join(' ').replace(/\s+/g, ' ').trim();
    };
    // "Shop Now", "Read The Review" and similar call-to-action links get the redesign's yellow pixel-font link style
    var tagCtas = function (root) {
      [].forEach.call((root || document).querySelectorAll('article.hentry a, #zbr-sidebar a'), function (a) {
        if (/^\s*(shop now|buy now|pre-?order( now)?|read the review|listen now|listen here)\s*$/i.test(a.textContent)) a.classList.add('zbr-cta');
      });
    };
    var SIDE = /^\s*(johnny[’']?s\s+reco-?mmendations|reviews?|features?|last\s+(?:fucking\s+)?copy)\s*[:\-–—]\s*/i;
    var sideWidgets = [];

    // A post written as several sections separated by horizontal rules becomes one card per section.
    // Sections starting "Johnny's Reco-mmendations:", "Reviews:", "Features:" or "Last Copy:" go to the sidebar.
    [].slice.call(document.querySelectorAll('article.hentry')).forEach(function (art) {
      var col = art.querySelector('.post > .body.entry-content .sqs-layout .sqs-col-12');
      if (!col) return;
      var blocks = [].slice.call(col.children).filter(function (el) { return el.classList.contains('sqs-block'); });
      if (!blocks.some(isRule)) return;
      var groups = [[]];
      blocks.forEach(function (b) { if (isRule(b)) groups.push([]); else groups[groups.length - 1].push(b); });
      groups = groups.filter(function (g) { return g.length; });
      var prev = art;
      groups.forEach(function (g, k) {
        if (k === 0) { return; }
        var txt = textOf(g);
        var m = txt.match(SIDE);
        if (m) { sideWidgets.push({ label: m[1], blocks: g }); return; }
        // the tag: a label typed in square brackets at the start of the section, e.g. [Releases], otherwise a guess from the text
        var label = /music video/i.test(txt) ? 'Music Video' : 'Releases';
        var tagged = txt.match(/^\s*\[([^\]]{1,30})\]\s*/);
        if (tagged) {
          label = fixLabel(tagged[1]);
          var firstHtml = g.filter(function (b) { return b.classList.contains('sqs-block-html'); })[0];
          var p0 = firstHtml && firstHtml.querySelector('.sqs-html-content p, .sqs-html-content h1, .sqs-html-content h2, .sqs-html-content h3, .sqs-html-content h4');
          if (p0) {
            p0.innerHTML = p0.innerHTML.replace(/^\s*(?:<[^>]+>\s*)*\[[^\]]{1,30}\]\s*(?:<br\s*\/?>)?\s*/i, '');
            if (!p0.textContent.replace(/\u00a0/g, '').trim() && !p0.querySelector('img, iframe')) p0.parentNode.removeChild(p0);
          }
          txt = textOf(g);
        }
        var title = '';
        var first = g[0].querySelector('h1, h2, h3, h4');
        if (g[0].classList.contains('sqs-block-html') && first && first === g[0].querySelector('.sqs-html-content').firstElementChild) {
          title = first.textContent.trim();
          first.parentNode.removeChild(first);
        }
        var card = document.createElement('article');
        card.className = 'hentry zbr-section';
        card.innerHTML = '<div class="content-wrapper"><div class="post"><header><div class="article-meta-top"><span class="zbr-pill"></span></div>' +
          (title ? '<h1 class="entry-title"><a></a></h1>' : '') +
          '</header><div class="body entry-content"><div class="sqs-layout sqs-grid-12 columns-12"><div class="row sqs-row"><div class="col sqs-col-12 span-12"></div></div></div></div></div></div>';
        card.querySelector('.zbr-pill').textContent = label;
        if (title) card.querySelector('.entry-title a').textContent = title;
        var dest = card.querySelector('.sqs-col-12');
        g.forEach(function (b) { dest.appendChild(b); });
        prev.parentNode.insertBefore(card, prev.nextSibling);
        prev = card;
      });
      // leave only the first section in the original post
      blocks.forEach(function (b) { if (isRule(b) && b.parentNode) b.parentNode.removeChild(b); });
      groups.forEach(function (g, k) { if (k > 0) g.forEach(function (b) { if (b.parentNode === col) { b.style.display = 'none'; } }); });
    });

    // A label typed in square brackets at the very start of a post's first text, e.g. [Premiers], replaces its "News -- date" tag
    [].forEach.call(document.querySelectorAll('article.hentry:not(.zbr-section)'), function (art) {
      var box = art.querySelector('.post > .body .sqs-block-html .sqs-html-content');
      var p0 = box && box.querySelector('p, h1, h2, h3, h4');
      var m = p0 && p0.textContent.match(/^\s*\[([^\]]{1,30})\]\s*/);
      var meta = art.querySelector('.article-meta-top');
      if (!m || !meta) return;
      p0.innerHTML = p0.innerHTML.replace(/^\s*(?:<[^>]+>\s*)*\[[^\]]{1,30}\]\s*(?:<br\s*\/?>)?\s*/i, '');
      if (!p0.textContent.replace(/ /g, '').trim() && !p0.querySelector('img, iframe')) p0.parentNode.removeChild(p0);
      var pill = document.createElement('span');
      pill.className = 'zbr-pill';
      pill.textContent = fixLabel(m[1]);
      meta.innerHTML = '';
      meta.appendChild(pill);
    });

    // in the cards, swap Bandcamp embeds for the slim player; a card that starts with a player keeps the full-size
    // (album art) player, on phones too.
    [].forEach.call(document.querySelectorAll('article.hentry .sqs-block-embed iframe'), function (fr) {
      var blk = fr.closest('.sqs-block');
      var card = fr.closest('article.hentry');
      if (!blk || blk.style.display === 'none') return;
      var first = card && [].slice.call(card.querySelectorAll('.post > .body .sqs-block')).filter(function (b) { return b.style.display !== 'none' && !b.classList.contains('zbr-empty'); })[0];
      if (!/EmbeddedPlayer/.test(decodeURIComponent(fr.src || ''))) return;     // YouTube etc. stay as they are
      if (blk === first) { blk.classList.add('zbr-bc-big'); return; }
      var pl = bcFrom(fr, false);
      if (pl) blk.parentNode.replaceChild(pl, blk);
    });
    // the full-size player is as tall as it is wide, plus room for the title and controls
    var sizeBigPlayers = function () {
      [].forEach.call(document.querySelectorAll('.zbr-bc-big iframe'), function (f) {
        var w = Math.round(f.getBoundingClientRect().width);
        if (w > 0 && f._zw !== w) { f._zw = w; f.style.setProperty('height', (w + 120) + 'px', 'important'); }
      });
    };
    sizeBigPlayers();
    window.addEventListener('load', sizeBigPlayers);
    window.addEventListener('resize', sizeBigPlayers);
    if (window.ResizeObserver) {   // the two-column layout narrows the posts after the page loads
      var ro = new ResizeObserver(sizeBigPlayers);
      [].forEach.call(document.querySelectorAll('.zbr-bc-big'), function (b) { ro.observe(b); });
    }

    tagCtas();
    [].forEach.call(document.querySelectorAll('article.hentry h1.entry-title a, article.hentry h2.entry-title a'), function (a) {
      a.textContent = a.textContent.replace(/^\s*\d{4}\s*-\s*\d{1,2}\s*-\s*\d{1,2}\s*\/{2,3}\s*/, '');
    });
    // "Read More" follows the redesign's rules: only text-only cards (no photo, slideshow or call-to-action link)
    // with more than 500 characters are shortened. The first 500 characters show, then "Read More" opens the rest.
    [].forEach.call(document.querySelectorAll('article.hentry'), function (art) {
      var body = art.querySelector('.post > .body.entry-content');
      if (!body) return;
      if (art.querySelector('.article-meta-top .date a')) return;   // "News -- date" posts (the first post of each page) always show in full
      if (art.querySelector('.special-content, .sqs-block-image, .sqs-block-button, .sqs-block-gallery, a.zbr-cta')) return;
      var texts = [].slice.call(body.querySelectorAll('.sqs-block-html'));
      if (!texts.length) return;
      var paras = [];
      texts.forEach(function (t) { [].forEach.call(t.querySelectorAll('.sqs-html-content p'), function (p) { paras.push(p); }); });
      var full = paras.map(function (p) { return p.textContent; }).join(' ').replace(/\s+/g, ' ').trim();
      if (full.length <= 500) return;
      var cut = full.lastIndexOf(' ', 500);
      var preview = document.createElement('p');
      preview.className = 'zbr-preview';
      preview.appendChild(document.createTextNode(full.slice(0, cut > 0 ? cut : 500) + '… '));
      var more = document.createElement('a');
      more.className = 'zbr-readmore';
      more.href = '#';
      more.textContent = 'Read More';
      preview.appendChild(more);
      var firstBlock = texts[0].querySelector('.sqs-html-content');
      texts[0].classList.add('zbr-first-text');
      firstBlock.insertBefore(preview, firstBlock.firstChild);
      var lessWrap = document.createElement('p');
      lessWrap.className = 'zbr-less-wrap';
      var less = document.createElement('a');
      less.className = 'zbr-readmore';
      less.href = '#';
      less.textContent = 'Read Less';
      lessWrap.appendChild(less);
      texts[texts.length - 1].querySelector('.sqs-html-content').appendChild(lessWrap);
      art.classList.add('zbr-collapsed');
      more.addEventListener('click', function (e) { e.preventDefault(); art.classList.remove('zbr-collapsed'); });
      less.addEventListener('click', function (e) { e.preventDefault(); art.classList.add('zbr-collapsed'); });
    });

    // sidebar widgets taken from the post (compact Bandcamp players)
    var makeWidget = function (w) {
      var kind = /johnny/i.test(w.label) ? 'johnny' : /review/i.test(w.label) ? 'reviews' : /feature/i.test(w.label) ? 'features' : 'lastcopy';
      var title = { johnny: 'Johnny’s Reco-mmendations', reviews: 'Reviews', features: 'Features', lastcopy: '🚨 Last Copy' }[kind];
      var box = document.createElement('div');
      box.className = 'zbr-widget zbr-w-' + kind;
      box.innerHTML = '<h3></h3>';
      box.querySelector('h3').textContent = title;
      var firstText = true;
      w.blocks.forEach(function (b) {
        if (b.classList.contains('sqs-block-html')) {
          var src = b.querySelector('.sqs-html-content');
          if (!src) return;
          var c = src.cloneNode(true);
          if (firstText) {
            var p0 = c.querySelector('p, h1, h2, h3, h4');
            if (p0) p0.innerHTML = p0.innerHTML.replace(/^\s*(?:<[^>]+>\s*)*(johnny[’']?s\s+reco-?mmendations|reviews?|features?|last\s+(?:fucking\s+)?copy)\s*[:\-–—]\s*/i, '');
            firstText = false;
          }
          [].forEach.call(c.querySelectorAll('p'), function (p) { if (p.textContent.trim() || p.querySelector('img, iframe')) box.appendChild(p); });
        } else {
          var pl = bcFrom(b.querySelector('iframe'));
          if (pl) box.appendChild(pl);
        }
      });
      return box;
    };

    // Numbered pages: four page numbers and a "..." square, like 1 2 3 4 ...  ("..." jumps to the next four).
    // The list below holds every post's publish time (newest first) because Squarespace pages by "older than" times.
    (function () {
      var pager = document.querySelector('nav.page.pagination');
      if (!pager) return;
      var base = location.pathname;
      if (/\/(tag|category|author)\//.test(base)) return;
