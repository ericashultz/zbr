        // the tag: a label typed in square brackets at the start of the section, e.g. [Releases], otherwise a guess from the text
        var label = /music video/i.test(txt) ? 'Music Video' : 'Releases';
        var tagged = txt.match(/^\s*\[([^\]]{1,30})\]\s*/);
        if (tagged) {
          label = fixLabel(tagged[1]);
          var firstHtml = g.filter(function (b) { return b.classList.contains('sqs-block-html'); })[0];
          var p0 = firstHtml && firstHtml.querySelector('.sqs-html-content p, .sqs-html-content h1, .sqs-html-content h2, .sqs-html-content h3, .sqs-html-content h4');
          if (p0) {
            p0.innerHTML = p0.innerHTML.replace(/^\s*(?:<[^>]+>\s*)*\[[^\]]{1,30}\]\s*(?:<br\s*\/?>)?\s*/i, '');
            if (!p0.textContent.replace(/\u00a0/g, '').trim() && !p0.querySelector('img, iframe')) p0.parentNode.removeChild(p0);
          }
          txt = textOf(g);
        }
        var title = '';
        var first = g[0].querySelector('h1, h2, h3, h4');
        if (g[0].classList.contains('sqs-block-html') && first && first === g[0].querySelector('.sqs-html-content').firstElementChild) {
          title = first.textContent.trim();
          first.parentNode.removeChild(first);
        }
        var card = document.createElement('article');
        card.className = 'hentry zbr-section';
        card.innerHTML = '<div class="content-wrapper"><div class="post"><header><div class="article-meta-top"><span class="zbr-pill"></span></div>' +
          (title ? '<h1 class="entry-title"><a></a></h1>' : '') +
          '</header><div class="body entry-content"><div class="sqs-layout sqs-grid-12 columns-12"><div class="row sqs-row"><div class="col sqs-col-12 span-12"></div></div></div></div></div></div>';
        card.querySelector('.zbr-pill').textContent = label;
        if (title) card.querySelector('.entry-title a').textContent = title;
        var dest = card.querySelector('.sqs-col-12');
        g.forEach(function (b) { dest.appendChild(b); });
        prev.parentNode.insertBefore(card, prev.nextSibling);
        prev = card;
      });
      // leave only the first section in the original post
      blocks.forEach(function (b) { if (isRule(b) && b.parentNode) b.parentNode.removeChild(b); });
      groups.forEach(function (g, k) { if (k > 0) g.forEach(function (b) { if (b.parentNode === col) { b.style.display = 'none'; } }); });
    });

    // A label typed in square brackets at the very start of a post's first text, e.g. [Premiers], replaces its "News -- date" tag
    [].forEach.call(document.querySelectorAll('article.hentry:not(.zbr-section)'), function (art) {
      // a whole post that says "last fucking copy" / "operation x-ray" anywhere in its text is a Last Copy / Features box (on the news list; a post opened on its own stays)
      if (!document.body.classList.contains('view-item')) {
        var shown = [].slice.call(art.querySelectorAll('.post > .body .sqs-block')).filter(function (b) { return b.style.display !== 'none'; });
        var wholePhrase = phraseLabel(textOf(shown));
        if (wholePhrase) {
          dropMarker(shown);
          art.style.display = 'none';
          sideWidgets.push({ label: wholePhrase, blocks: shown, art: art });
          return;
        }
      }
      var box = art.querySelector('.post > .body .sqs-block-html .sqs-html-content');
      var p0 = box && box.querySelector('p, h1, h2, h3, h4');
      var m = p0 && p0.textContent.match(/^\s*\[([^\]]{1,30})\]\s*/);
      var meta = art.querySelector('.article-meta-top');
      if (!m || !meta) return;
      if (SIDE_NAME.test(m[1].trim())) {   // [Last Copy], [Reviews], [Features], [Johnny's Reco-mmendations] on a whole post: it moves to the sidebar
        var bl = [].slice.call(art.querySelectorAll('.post > .body .sqs-block'));
        dropMarker(bl);
        art.style.display = 'none';
        sideWidgets.push({ label: m[1].trim(), blocks: bl, art: art });
        return;
      }
      p0.innerHTML = p0.innerHTML.replace(/^\s*(?:<[^>]+>\s*)*\[[^\]]{1,30}\]\s*(?:<br\s*\/?>)?\s*/i, '');
      if (!p0.textContent.replace(/ /g, '').trim() && !p0.querySelector('img, iframe')) p0.parentNode.removeChild(p0);
      var pill = document.createElement('span');
      pill.className = 'zbr-pill';
      pill.textContent = fixLabel(m[1]);
      meta.innerHTML = '';
      meta.appendChild(pill);
    });

    // in the cards, swap Bandcamp embeds for the slim player; a card that starts with a player gets the
    // medium player (120px, small album art), on phones too
    [].forEach.call(document.querySelectorAll('article.hentry .sqs-block-embed iframe'), function (fr) {
      var blk = fr.closest('.sqs-block');
      var card = fr.closest('article.hentry');
      if (!blk || blk.style.display === 'none') return;
      var first = card && [].slice.call(card.querySelectorAll('.post > .body .sqs-block')).filter(function (b) { return b.style.display !== 'none' && !b.classList.contains('zbr-empty'); })[0];
      if (!/EmbeddedPlayer/.test(decodeURIComponent(fr.src || ''))) return;     // YouTube etc. stay as they are
      var pl = bcFrom(fr, blk === first);
      if (pl) blk.parentNode.replaceChild(pl, blk);
    });

    tagCtas();
    // two or more call-to-action buttons in a row sit on one line ("Shop Canada Store   Shop USA Store")
    var ctaNeutral = function (b) {
      return b.classList.contains('sqs-block-spacer') || b.classList.contains('zbr-empty') ||
        (b.classList.contains('sqs-block-html') && !b.textContent.replace(/\u00a0/g, '').trim() && !b.querySelector('img, iframe'));
    };
    // (found in reading order, so buttons that live in separate rows or columns of the post still group up)
    [].forEach.call(document.querySelectorAll('article.hentry'), function (art) {
      var blocks = [].slice.call(art.querySelectorAll('.sqs-block, .zbr-bcplayer')).filter(function (b) {
        return !(b.parentNode && b.parentNode.closest && b.parentNode.closest('.sqs-block'));
      });
      var run = [], pending = [], between = [];
      var flush = function () {
        if (run.length >= 2) {
          var first = run[0];
          var row = document.createElement('div');
          row.className = 'zbr-cta-row';
          first.parentNode.insertBefore(row, first);
          if (first.classList.contains('zbr-cta-gap')) row.classList.add('zbr-cta-gap');
          run.forEach(function (b) { b.classList.remove('zbr-cta-gap'); b.style.removeProperty('margin-top'); row.appendChild(b); });
          between.forEach(function (b) { b.classList.add('zbr-empty'); });
        }
        run = []; pending = []; between = [];
      };
      var afterCta = false;   // blank blocks right after a CTA would only add stray space before the player
      // blank blocks / spacers after the last real content of the card only add empty room above the frame
      var lastReal = -1;
      blocks.forEach(function (b, ix) { if (b.style.display !== 'none' && !ctaNeutral(b)) lastReal = ix; });
      blocks.forEach(function (b, ix) { if (ix > lastReal && b.style.display !== 'none') b.classList.add('zbr-empty'); });
      blocks.forEach(function (b) {
        if (b.style.display === 'none') return;
        if (b.classList.contains('sqs-block-button')) {
          if (run.length) between = between.concat(pending);
          pending = [];
          run.push(b);
          afterCta = true;
        } else if (ctaNeutral(b)) {
          if (run.length) pending.push(b);
          if (afterCta) b.classList.add('zbr-empty');
        } else { flush(); afterCta = false; }
      });
      flush();
    });
    [].forEach.call(document.querySelectorAll('article.hentry h1.entry-title a, article.hentry h2.entry-title a'), function (a) {
      var t = a.textContent.replace(/^\s*\d{4}\s*-\s*\d{1,2}\s*-\s*\d{1,2}\s*\/{2,3}\s*/, '');
      // headlines are plain text, not links: swap the link for its words
      a.parentNode.replaceChild(document.createTextNode(t), a);
    });
    // the blue "News -- date" pill is a label, not a link: drop its address (the element stays, so the styling and checks above still work)
    [].forEach.call(document.querySelectorAll('article.hentry .article-meta-top .date a'), function (a) {
      a.removeAttribute('href');
    });
    // "Read More" follows the redesign's rules: only text-only cards (no photo, slideshow or call-to-action link)
    // with more than 500 characters are shortened. The first 500 characters show, then "Read More" opens the rest.
    [].forEach.call(document.querySelectorAll('article.hentry'), function (art) {
      var body = art.querySelector('.post > .body.entry-content');
      if (!body) return;
      if (document.body.classList.contains('view-item')) return;   // a post opened on its own shows in full
      if (art.querySelector('.article-meta-top .date a')) return;   // "News -- date" posts (the first post of each page) always show in full
      if (art.querySelector('.special-content, .sqs-block-image, .sqs-block-button, .sqs-block-gallery, a.zbr-cta')) return;
      var texts = [].slice.call(body.querySelectorAll('.sqs-block-html'));
      if (!texts.length) return;
      var paras = [];
      texts.forEach(function (t) { [].forEach.call(t.querySelectorAll('.sqs-html-content p'), function (p) { paras.push(p); }); });
      var full = paras.map(function (p) { return p.textContent; }).join(' ').replace(/\s+/g, ' ').trim();
      if (full.length <= 500) return;
      var cut = full.lastIndexOf(' ', 500);
      var preview = document.createElement('p');
      preview.className = 'zbr-preview';
      preview.appendChild(document.createTextNode(full.slice(0, cut > 0 ? cut : 500) + '… '));
      var more = document.createElement('a');
      more.className = 'zbr-readmore';
      more.href = '#';
      more.textContent = 'Read More';
      preview.appendChild(more);
      var firstBlock = texts[0].querySelector('.sqs-html-content');
      texts[0].classList.add('zbr-first-text');
      firstBlock.insertBefore(preview, firstBlock.firstChild);
      var lessWrap = document.createElement('p');
      lessWrap.className = 'zbr-less-wrap';
      var less = document.createElement('a');
      less.className = 'zbr-readmore';
      less.href = '#';
      less.textContent = 'Read Less';
      lessWrap.appendChild(less);
      texts[texts.length - 1].querySelector('.sqs-html-content').appendChild(lessWrap);
      art.classList.add('zbr-collapsed');
      more.addEventListener('click', function (e) { e.preventDefault(); art.classList.remove('zbr-collapsed'); });
      less.addEventListener('click', function (e) { e.preventDefault(); art.classList.add('zbr-collapsed'); });
    });

    // sidebar widgets taken from the post (compact Bandcamp players)
    var makeWidget = function (w) {
      var kind = /johnny/i.test(w.label) ? 'johnny' : /review/i.test(w.label) ? 'reviews' : /feature/i.test(w.label) ? 'features' : 'lastcopy';
      var title = { johnny: 'Johnny’s Reco-mmendations', reviews: 'Reviews', features: 'Features', lastcopy: '🚨 Last Copy' }[kind];
      var box = document.createElement('div');
      box.className = 'zbr-widget zbr-w-' + kind;
      box.innerHTML = '<h3></h3>';
      box.querySelector('h3').textContent = title;
      var firstText = true;
      w.blocks.forEach(function (b) {
        if (b.classList.contains('sqs-block-html')) {
          var src = b.querySelector('.sqs-html-content');
          if (!src) return;
          var c = src.cloneNode(true);
          if (firstText) {
            var p0 = c.querySelector('p, h1, h2, h3, h4');
            if (p0) p0.innerHTML = p0.innerHTML.replace(/^\s*(?:<[^>]+>\s*)*\[[^\]]{1,30}\]\s*(?:<br\s*\/?>)?\s*/i, '').replace(/^\s*(?:<[^>]+>\s*)*(johnny[’']?s\s+reco-?mmendations|reviews?|features?|last\s+(?:fucking\s+)?copy)\s*[:\-–—]\s*/i, '');
            firstText = false;
          }
          [].forEach.call(c.querySelectorAll('p'), function (p) { if (p.textContent.trim() || p.querySelector('img, iframe')) box.appendChild(p); });
        } else if (b.classList.contains('sqs-block-button')) {
          var ba = b.querySelector('a');
          if (ba) {
            var cp = document.createElement('p');
            var ca = document.createElement('a');
            ca.href = ba.getAttribute('href') || '#';
            ca.textContent = ba.textContent.trim();
            ca.className = 'zbr-cta';
            if (ba.target) { ca.target = ba.target; ca.rel = 'noopener'; }
            cp.appendChild(ca);
            box.appendChild(cp);
          }
        } else {
          var efr = b.querySelector('iframe');
          var raw = decodeURIComponent((efr && efr.src) || '');
          var pl = bcFrom(efr);
          var ex = null;
          if (pl) { box.appendChild(pl); }
          else if (/soundcloud\.com\/player/.test(raw)) {       // SoundCloud: the compact classic player
            var scUrl = (raw.match(/[?&]url=([^&]+)/) || [])[1];
            if (scUrl) {
              ex = document.createElement('div');
              ex.className = 'zbr-embed zbr-sc';
              ex.innerHTML = '<iframe src="https://w.soundcloud.com/player/?url=' + encodeURIComponent(scUrl) + '&color=%23ff5500&visual=false&hide_related=true&show_comments=false&show_teaser=false" title="SoundCloud player"></iframe>';
            }
          } else if (/youtube\.com\/embed/.test(raw)) {          // YouTube: a 16:9 video
            ex = document.createElement('div');
            ex.className = 'zbr-embed zbr-yt';
            ex.innerHTML = '<iframe src="' + efr.src + '" title="Video" allowfullscreen></iframe>';
          }
          if (ex) box.appendChild(ex);
        }
      });
      return box;
    };

    // Numbered pages: four page numbers and a "..." square, like 1 2 3 4 ...  ("..." jumps to the next four).
    // The list below holds every post's publish time (newest first) because Squarespace pages by "older than" times.
    (function () {
      var pager = document.querySelector('nav.page.pagination');
      if (!pager) return;
      var base = location.pathname;
      if (/\/(tag|category|author)\//.test(base)) return;
      var TS = window.__zbrTS.split(',');
      var T = [], acc = 0, idxOf = {};
      TS.forEach(function (x, n) { acc = n === 0 ? parseInt(x, 36) : acc - parseInt(x, 36); T.push(acc); idxOf[acc] = n; });
      var size = 5;
      var known = {};   // page number -> offset, read straight from Squarespace for the newest pages (posts newer than the list below)
      // find the newest post we have a time for (posts added since the list was made come before it)
      function locate(url, seen, tries) {
        return fetch(url, { credentials: 'same-origin' })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            var items = d.items || [], n;
            if (seen === 0 && d.pagination && d.pagination.nextPage && items.length) size = items.length;
            if (d.pagination && d.pagination.nextPage && items.length && (seen + items.length) % size === 0) known[(seen + items.length) / size + 1] = d.pagination.nextPageOffset;
            for (n = 0; n < items.length; n++) { if (idxOf[items[n].publishOn] !== undefined) return { i: seen + n, p: idxOf[items[n].publishOn] }; }
            if (tries > 0 && d.pagination && d.pagination.nextPage) return locate(base + '?format=json&offset=' + d.pagination.nextPageOffset, seen + items.length, tries - 1);
            return null;
          });
      }
      locate(base + '?format=json', 0, 6)
        .then(function (loc) {
          if (!loc) return;
          var i = loc.i, p = loc.p;
          var pages = Math.ceil(((T.length - p) + i) / size);
          var q = location.search.match(/[?&]offset=(\d+)/);
          var current = 1;
          if (q) {
            var off = parseInt(q[1], 10), firstT;
            if (idxOf[off] !== undefined) firstT = idxOf[off] + 1;
            else { firstT = 0; while (firstT < T.length && T[firstT] >= off) firstT++; }
            current = Math.floor((firstT - p + i) / size) + 1;
          }
          function href(N) {
            if (N === 1) return base;
            if (known[N]) return base + '?offset=' + known[N];
            var t = (size * (N - 1) - 1) - i + p;
            return t >= 0 && t < T.length ? base + '?offset=' + T[t] : null;
          }
          var html = '';
          var firstDate = document.querySelector('article.hentry time.published');
          if (firstDate) html += '<span class="zbr-pagenav-label">News from ' + firstDate.textContent.trim() + '</span>';
          var nav = document.createElement('nav');
          nav.className = 'zbr-pagenav';
          nav.setAttribute('aria-label', 'News pages');
          nav.innerHTML = html + '<div class="zbr-pagenav-buttons"></div>';
          var box = nav.querySelector('.zbr-pagenav-buttons');
          // like the store: previous / next arrows that go straight to the neighbouring page, the first and last page,
          // and the pages around this one with "..." where numbers are skipped
          function pageList(cur, n, ar) {
            var keep = {};
            keep[1] = 1; keep[n] = 1;
            for (var q2 = cur - ar; q2 <= cur + ar; q2++) if (q2 >= 1 && q2 <= n) keep[q2] = 1;
            var nums = Object.keys(keep).map(Number).sort(function (x, y) { return x - y; }), out = [], prev = 0;
            nums.forEach(function (x) {
              if (prev && x - prev === 2) out.push(prev + 1);
              else if (prev && x - prev > 2) out.push('gap');
              out.push(x);
              prev = x;
            });
            return out;
          }
          function arrowHtml(sym, target, label) {
            var h = target >= 1 && target <= pages ? href(target) : null;
            return h ? '<a class="zbr-pg zbr-pg-arrow" href="' + h + '" aria-label="' + label + '">' + sym + '</a>'
                     : '<span class="zbr-pg zbr-pg-arrow zbr-pg-off" aria-hidden="true">' + sym + '</span>';
          }
          var drawnAround = 0;
          function draw() {
            var around = window.matchMedia('(max-width:900px)').matches ? 1 : 2;
            if (around === drawnAround) return;
            drawnAround = around;
            var out = arrowHtml('&lsaquo;', current - 1, 'Previous page');
            pageList(current, pages, around).forEach(function (N) {
              if (N === 'gap') { out += '<span class="zbr-pg-gap" aria-hidden="true">&hellip;</span>'; return; }
              if (N === current) { out += '<span class="zbr-pg" aria-current="true">' + N + '</span>'; return; }
              var h = href(N);
              out += h ? '<a class="zbr-pg" href="' + h + '" aria-label="Page ' + N + '">' + N + '</a>' : '<span class="zbr-pg zbr-pg-off">' + N + '</span>';
            });
            out += arrowHtml('&rsaquo;', current + 1, 'Next page');
            box.innerHTML = out;
          }
          draw();
          var drawTimer;
          window.addEventListener('resize', function () { clearTimeout(drawTimer); drawTimer = setTimeout(draw, 150); });
          pager.classList.add('zbr-hidden');
          pager.parentNode.insertBefore(nav, pager.nextSibling);
          // wide screens: if the two-column layout already moved Newer/Older under the whole page, put the numbers there too
          if (document.getElementById('zbr-news-layout') && pager.parentNode === document.getElementById('page')) { /* already page level */ }
        })
        .catch(function () {});
    })();

    var page = document.getElementById('page');
    var showWidgetsAsCards = function () {
      sideWidgets.forEach(function (w) {
        w.blocks.forEach(function (b) { b.style.display = ''; });
        if (w.art) w.art.style.display = '';
      });
    };
    if (page) {
      fetch('/news-sidebar', { credentials: 'same-origin' })
        .then(function (r) { return r.ok ? r.text() : ''; })
        .then(function (html) {
          if (!html) { showWidgetsAsCards(); return; }
          var doc = new DOMParser().parseFromString(html, 'text/html');
          var blk = null;
          [].some.call(doc.querySelectorAll('.sqs-block-code .sqs-block-content, .sqs-block-html .sqs-block-content'), function (b) {
            if (b.querySelector('.zbr-widget')) { blk = b; return true; }
            return false;
          });
          if (!blk || document.getElementById('zbr-news-layout')) { showWidgetsAsCards(); return; }
          var layout = document.createElement('div');
          layout.id = 'zbr-news-layout';
          var main = document.createElement('div');
          main.id = 'zbr-news-main';
          while (page.firstChild) main.appendChild(page.firstChild);
          var side = document.createElement('aside');
          side.id = 'zbr-sidebar';
          side.innerHTML = blk.innerHTML;
          var anchor = side.querySelector('.zbr-w-quick');
          var postBoxes = [];
          sideWidgets.forEach(function (w) {
            var box = makeWidget(w);
            postBoxes.push(box);
            if (anchor && anchor.parentNode) { anchor.parentNode.insertBefore(box, anchor.nextSibling); anchor = box; } else side.appendChild(box);
          });
          layout.appendChild(main);
          layout.appendChild(side);
          page.appendChild(layout);
          tagCtas(side);
          // phones and tablets: Last Copy / Reviews / Features / Johnny's go above the page numbers, right under the last post
          // (only Quick Links, Guestbook and Mailing List stay below them); wide screens keep them in the sidebar
          var placeBoxes = function () {
            try {
              if (window.matchMedia('(max-width:900px)').matches) {
                var before = main.querySelector('nav.pagination');
                var host = before ? before.parentNode : main;
                postBoxes.forEach(function (b) { host.insertBefore(b, before); });
              } else {
                var q = side.querySelector('.zbr-w-quick');
                var host2 = q && q.parentNode ? q.parentNode : side;
                var ref = q ? q.nextSibling : null;
                while (ref && postBoxes.indexOf(ref) > -1) ref = ref.nextSibling;
                postBoxes.forEach(function (b) { host2.insertBefore(b, ref); });
              }
            } catch (e) {}
          };
          if (window.matchMedia('(max-width:900px)').matches) placeBoxes();
          var placeTimer;
          window.addEventListener('resize', function () { clearTimeout(placeTimer); placeTimer = setTimeout(placeBoxes, 150); });
          // wide screens: centre Newer / Older under the whole page, not just the posts column
          var pager = main.querySelector('nav.pagination');
          var numbers = main.querySelector('.zbr-pagenav');
          if (pager && !window.matchMedia('(max-width:900px)').matches) { page.appendChild(pager); if (numbers) page.appendChild(numbers); }

          // Phones and tablets: Quick Links becomes a collapsed bar, under the main menu and again under the page numbers
          var quick = side.querySelector('.zbr-w-quick .zbr-quicklinks');
          if (quick) {
            var makeBar = function (extra) {
              var mq = document.createElement('div');
              mq.className = 'zbr-mobile-quick' + (extra ? ' ' + extra : '');
              var btn = document.createElement('button');
              btn.type = 'button';
              btn.className = 'zbr-mq-toggle';
              btn.setAttribute('aria-expanded', 'false');
              btn.innerHTML = 'Quick Links <span class="zbr-mq-arrow">&#9660;</span>';
              var grid = quick.cloneNode(true);
              grid.className = 'zbr-quicklinks zbr-mq-grid zbr-collapsed';
              btn.addEventListener('click', function () {
                var collapsed = grid.classList.toggle('zbr-collapsed');
                btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
              });
              mq.appendChild(btn);
              mq.appendChild(grid);
              return mq;
            };
            page.insertBefore(makeBar(''), layout);
            side.insertBefore(makeBar('zbr-mq-bottom'), side.firstChild);
          }
        })
        .catch(function () { if (!document.getElementById('zbr-news-layout')) showWidgetsAsCards(); });
    } else {
      showWidgetsAsCards();
    }
  }
})();
</script>
